<header class="topbar">
  <a class="brand" aria-label="Principia, inicio" routerLink="/inicio">
    <img class="brand-logo" src="/assets/logo.png" alt="" />
    <span>Principia</span>
  </a>

  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m16 16 4 4"></path>
    </svg>
    <input
      type="search"
      [ngModel]="searchTerm"
      (ngModelChange)="searchTermChange.emit($event)"
      [ngModelOptions]="{ standalone: true }"
      placeholder="Buscar en Principia"
      aria-label="Buscar"
    />
  </label>

  <button class="logout" type="button" (click)="logout()">Cerrar sesión</button>
</header>
