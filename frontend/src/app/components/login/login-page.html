<main class="login-page">
  <section class="login-card" aria-labelledby="login-heading">
    <a class="brand" routerLink="/" aria-label="Principia">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 3 22 12 12 21 2 12 12 3Z" />
        </svg>
      </span>
      <span>Principia</span>
    </a>

    <h1 id="login-heading">Bienvenido de nuevo</h1>
    <p class="intro">Inicia sesión para volver a tus simulaciones y foros.</p>

    @if (registrationComplete) {
      <p class="success-message" role="status">
        Tu cuenta ya está creada. Inicia sesión para continuar.
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="username">Usuario</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        required
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />

      @if (errorMessage) {
        <p class="error-message" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="register-link">
      ¿Todavía no tienes cuenta? <a routerLink="/registro">Regístrate gratis</a>
    </p>
  </section>
</main>
