<main class="register-page">
  <section class="register-card" aria-labelledby="register-heading">
    <a class="brand" routerLink="/" aria-label="Principia, inicio">
      <img class="brand-logo" src="/assets/logo.png" alt="" />
      <span>Principia</span>
    </a>

    <h1 id="register-heading">Empezá a explorar</h1>
    <p class="intro">Crea tu cuenta gratis y descubrí una nueva forma de aprender física.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <label for="username">Usuario</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        maxlength="150"
        required
      />

      <label for="first_name">Nombre</label>
      <input
        id="first_name"
        type="text"
        formControlName="first_name"
        autocomplete="given-name"
        maxlength="150"
        required
      />

      <label for="last_name">Apellido</label>
      <input
        id="last_name"
        type="text"
        formControlName="last_name"
        autocomplete="family-name"
        maxlength="150"
        required
      />

      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" required />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        minlength="8"
        required
      />
      <p class="field-hint">Usá al menos 8 caracteres.</p>

      <label for="passwordConfirmation">Confirmar contraseña</label>
      <input
        id="passwordConfirmation"
        type="password"
        formControlName="passwordConfirmation"
        autocomplete="new-password"
        required
      />

      @if (errorMessage) {
        <p class="error-message" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Creando cuenta…' : 'Crear cuenta gratis' }}
      </button>
    </form>

    <p class="login-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
